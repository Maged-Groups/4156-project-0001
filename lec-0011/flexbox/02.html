<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: all 0.3s;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            border: solid 10px;
            background-color: lightblue;
        }

        header, main, footer{
            border: solid red;
        }

        main {
            flex-grow: 1;
        }
    </style>
</head>

<body>

    <!-- header -->
    <header>header</header>

    <!-- main -->
    <main>main</main>

    <!-- footer -->
    <footer>footer</footer>
</body>

</html>
