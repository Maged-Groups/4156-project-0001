<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors</title>
</head>

<body>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: all 0.3s;
        }

        body{
            height: 100vh;
            background-image: url(bg-01.jpg);
            background-repeat: no-repeat;
            background-position: right;
            background-size: cover;
        }

        div {
            padding: 20px;
            border: solid;
            width: 90%;
            margin: 20px auto;

            &:nth-of-type(1) {
                background-color: magenta;
            }

            &:nth-of-type(2) {
                background-color: rgb(255, 0, 255);
            }

            &:nth-of-type(3) {
                background-color: hsl(300, 100%, 50%);
            }

            &:nth-of-type(4) {
                background-color: #ff00ff;
            }

            &:nth-of-type(5) {
                background-color: rgba(255, 0, 255, 0.575515);
                /* opacity: 0; */
            }

            &:nth-of-type(6) {
                background-color: hsla(300, 100%, 50%, 0.5);
            }

            &:nth-of-type(7) {
                background-color: #ff00ff55;
            }

            &:nth-of-type(8) {
                background-color: #f0f;
            }

            &:nth-of-type(9) {
                background-color: #f0f5;
            }

            &:nth-of-type(10) {
                height: 300px;
                /* background-image: linear-gradient(red, green); */
                /* background-image: linear-gradient(red 50%, green 80%); */
                /* background-image: linear-gradient(to right, red 50%, green 80%); */
                /* background-image: linear-gradient(18deg, red 50%, green 80%); */
                /* background-image: linear-gradient(-18deg, red 50%, green 80%); */
                background-image: linear-gradient(-18deg, red 3%, green 10%, yellow, pink, black, magenta, rgb(40,90,150));
            }
            &:nth-of-type(11) {
                height: 300px;
                background-image: radial-gradient( red 3%, green 10%, yellow, pink, black, magenta, rgb(40,90,150));
                background-image: radial-gradient(circle, red 3%, green 10%, yellow, pink, black, magenta, rgb(40,90,150));
            }
            &:nth-of-type(12) {
                width: 300px;
                height: 300px;
                border-radius: 50%;
                /* background-image: conic-gradient(red , green , yellow); */
                background-image: conic-gradient(red 0% 20%, green 20% 40%, yellow 40% 100%);
                
            }
            &:nth-of-type(13) {
                width: 300px;
                height: 300px;
                border-radius: 50%;
                border: none;
                /* background-image: conic-gradient(red , green , yellow); */
                background-image: conic-gradient(red 0% 20%, green 20% 40%, rgba(0,0,0,0) 40% 80%, yellow 80% 100%);
                animation: circle 1s infinite linear !important;
                box-shadow: 45px 15px 40px  inset;
            }
        }


        @keyframes circle {
            0%{transform: rotate(0deg);}
            100%{transform: rotate(360deg);}
        }
            
            </style>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>

    <div></div>
    <div></div>
    <div></div>
</body>

</html>
