<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Before & After</title>
</head>

<body>

    <style>
        * {
            /* margin: 0;
            padding: 0; */
            box-sizing: border-box;
            transition: all 0.3s;
        }

        .parent {
            ul {
                list-style-type: none;
                display: grid;
                gap: 20px;

                [data-price] {
                    display: flex;
                    gap: 30px;
                    width: 200px;
                    height: 100px;
                    border-radius: 8px;
                    border: solid 1px;
                    justify-content: center;
                    align-items: center;
                    position: relative;
                    overflow: hidden;

                    &:hover::after {
                        content: attr(data-price);
                        color: white;
                        position: absolute;
                        top: -6px;
                        right: -4px;
                        background-color: lightsalmon;
                        padding: 8px 20px;
                        border-radius: 8px;
                        transform: rotate(18deg);
                    }
                }
            }

        }
    </style>

    <h1>Products</h1>
    <div class="parent">
        <ul>
            <li data-price="500">Lorem, ipsum dolor.</li>
            <li data-price="800">Quae, consequuntur eum.</li>
            <li data-price="121">Ducimus, esse quo!</li>
            <li data-price="1200">Fugit, repellat atque?</li>
            <li data-price="350">A, eum assumenda.</li>
            <li data-price="750">Perspiciatis, hic aspernatur?</li>
            <li data-price="600">Quisquam, inventore excepturi!</li>
            <li data-price="600">Blanditiis, vel praesentium?</li>
            <li data-price="800">Odit, voluptatem accusamus.</li>
            <li data-price="1410">Autem, suscipit aspernatur.</li>
        </ul>
    </div>

</body>

</html>
